services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: secure-n-tier-app
    ports:
      - "3000:3000"
    environment:
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: secure-n-tier-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data: